<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="CineStream - Stream Movies & TV Series powered by CineHype" />
    <title>CineStream - Movies & TV Shows</title>
    <style>
      html, body {
        background: #0b0c10;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background: #f4f5f8;
      }
    </style>
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('cinestream_theme');
          document.documentElement.setAttribute('data-theme', saved || 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-rose-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
