name: Build CineStream APK

# Every push to main builds, signs and publishes a new versioned release
# (v<major>.<minor>.<run number>), so each push can be installed on its own
# and installs over the previous one in place. Edit `version` in package.json
# (e.g. 1.0.0 -> 1.1.0) to bump the major/minor part.
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a run mid-release: a half-published tag is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The Android SDK is preinstalled on the runner; just accept licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # versionName = <package.json major>.<minor>.<run number>. versionCode is
      # the run number, which only ever grows, so Android always accepts the
      # new build as an update.
      - name: Compute Version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "VERSION=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building ${BASE}.${GITHUB_RUN_NUMBER} (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Bundle
        run: npm run build
        env:
          APP_VERSION: ${{ env.VERSION }}

      # The android/ project is not committed: generate it, sync the web
      # assets, then apply the version and the popup-blocking MainActivity.
      - name: Generate and Sync Android Project
        run: |
          npx cap add android
          npx cap sync android
          cp android-overrides/MainActivity.java android/app/src/main/java/com/cinehype/stream/MainActivity.java
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" "$GRADLE"
          grep -E 'versionCode|versionName' "$GRADLE"

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Android refuses unsigned APKs ("App not installed"). The keystore is
      # committed at signing/release.p12 so every build carries the same
      # signature and installs over the previous version.
      - name: Align and Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p build-output
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks signing/release.p12 --ks-type pkcs12 \
            --ks-key-alias cinestream --ks-pass pass:cinestream-app-key \
            --out "build-output/CineStream-v${VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "build-output/CineStream-v${VERSION}.apk"
          ls -lh build-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-v${{ env.VERSION }}
          path: build-output/CineStream-v${{ env.VERSION }}.apk
          retention-days: 30

      # One release per push, tagged on the exact commit that was built.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "## CineStream v${VERSION}"
            echo
            echo "Built from commit \`${GITHUB_SHA::7}\` on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "### Changes"
            echo "${COMMIT_MESSAGE:-Manual build}"
            echo
            echo "### Install"
            echo "Download **CineStream-v${VERSION}.apk** below. It updates the previous version in place and keeps your library and history. Requires Android 8.0 or later."
          } > release-notes.md
          gh release create "v${VERSION}" "build-output/CineStream-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "CineStream v${VERSION}" \
            --notes-file release-notes.md \
            --latest
