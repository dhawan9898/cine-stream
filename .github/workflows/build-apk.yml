name: Build CineStream APK

# Every push to main builds, signs and publishes a new versioned release
# (v<major>.<minor>.<run number>), so each push can be installed on its own
# and installs over the previous one in place. Edit `version` in package.json
# (e.g. 1.0.0 -> 1.1.0) to bump the major/minor part.
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a run mid-release: a half-published tag is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Full history + tags: the release notes list every commit since the previous release.
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The Android SDK is preinstalled on the runner; just accept licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # versionName = <package.json major>.<minor>.<run number>. versionCode is
      # the run number, which only ever grows, so Android always accepts the
      # new build as an update.
      - name: Compute Version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "VERSION=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building ${BASE}.${GITHUB_RUN_NUMBER} (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Web Production Bundle
        run: |
          if [ -z "$VITE_TMDB_API_KEY" ]; then
            echo "::error::Repository secret TMDB_API_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          npm run build
        env:
          APP_VERSION: ${{ env.VERSION }}
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # The android/ project is not committed: generate it, sync the web
      # assets, then apply the version and the native Jetpack Media3 ExoPlayer
      # overrides. scripts/patch-android.mjs fails the build if any patch step
      # does not apply (instead of silently shipping without the native player).
      - name: Generate and Sync Android Project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs --version "${VERSION}" --version-code "${VERSION_CODE}"
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      # Android refuses unsigned APKs ("App not installed"). Every build must carry the same signature
      # so it installs over the previous version. The key comes from repository secrets when they are set
      # (KEYSTORE_BASE64 = base64 of the .p12, KEYSTORE_PASSWORD, optional KEY_ALIAS); until then the
      # keystore committed at signing/release.p12 is used - which anyone with repo access can sign with,
      # so move to the secrets (see README, "Release signing").
      - name: Align and Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KS_PASS" ]; then
            KS="$RUNNER_TEMP/release.p12"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          else
            echo "::warning::Signing with the keystore committed in the repository. Set the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets."
            KS=signing/release.p12
            export KS_PASS=cinestream-app-key
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p build-output
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-type pkcs12 \
            --ks-key-alias "${KEY_ALIAS:-cinestream}" --ks-pass env:KS_PASS \
            --out "build-output/CineStream-v${VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.p12"
          "$BT/apksigner" verify --print-certs "build-output/CineStream-v${VERSION}.apk"
          ls -lh build-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-v${{ env.VERSION }}
          path: build-output/CineStream-v${{ env.VERSION }}.apk
          retention-days: 30

      # One release per push, tagged on the exact commit that was built.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every commit since the previous release (a push can carry several).
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+(\.[0-9]+)+$' | grep -vx "v${VERSION}" | head -1 || true)
          CHANGES=$(git log --no-merges --format='#### %s%n%n%b' "${PREV:+$PREV..}HEAD" | grep -v '^Co-Authored-By' | cat -s)
          {
            echo "## CineStream v${VERSION}"
            echo
            echo "Built from commit \`${GITHUB_SHA::7}\` on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "### What's changed"
            echo "${CHANGES:-Manual build}"
            echo
            echo "### Install"
            echo "Download **CineStream-v${VERSION}.apk** below. It updates the previous version in place and keeps your library and history. Requires Android 8.0 or later."
          } > release-notes.md
          gh release create "v${VERSION}" "build-output/CineStream-v${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "CineStream v${VERSION}" \
            --notes-file release-notes.md \
            --latest
