name: Build APK and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build

      # The android/ project is not committed, so generate it, then sync web assets.
      - run: npx cap add android
      - run: npx cap sync android

      - name: Build APK (debug-signed so it is installable)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/debug/app-debug.apk "CineStream-${SHORT}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk CineStream-latest.apk
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: CineStream-apk
          path: CineStream-*.apk

      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest CineStream-latest.apk "CineStream-${SHORT}.apk" \
            --target "$GITHUB_SHA" \
            --title "CineStream (latest build)" \
            --notes "Automated build of commit ${GITHUB_SHA} on $(date -u +'%Y-%m-%d %H:%M UTC')."
