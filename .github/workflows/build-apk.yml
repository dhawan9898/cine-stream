name: Build APK and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build

      # The android/ project is not committed, so generate it, then sync web assets.
      - run: npx cap add android
      - run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type pkcs12 \
            --ks-key-alias cinestream --ks-pass env:KEYSTORE_PASSWORD \
            --out CineStream-latest.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify CineStream-latest.apk
          SHORT=$(git rev-parse --short HEAD)
          cp CineStream-latest.apk "CineStream-${SHORT}.apk"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: CineStream-apk
          path: CineStream-*.apk

      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest CineStream-latest.apk "CineStream-${SHORT}.apk" \
            --target "$GITHUB_SHA" \
            --title "CineStream (latest build)" \
            --notes "Automated build of commit ${GITHUB_SHA} on $(date -u +'%Y-%m-%d %H:%M UTC')."
