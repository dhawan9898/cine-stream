name: Build APK and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK is preinstalled on the runner; just accept licenses.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: npm ci
      - run: npm run build

      # The android/ project is not committed, so generate it, then sync web assets.
      - run: npx cap add android
      - run: npx cap sync android

      # Block ad popups / external-browser launches from the stream iframe.
      - run: cp android-overrides/MainActivity.java android/app/src/main/java/com/cinehype/stream/MainActivity.java

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      # Android refuses to install unsigned APKs ("App not installed"), so always sign.
      # Preferred: persistent keystore from secrets (keeps the signature stable so updates
      # install over older versions). Fallback: the debug-signed APK, which installs fine
      # but may need an uninstall first when updating from a build signed by another key.
      - name: Align, sign and prepare APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
            "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type pkcs12 \
              --ks-key-alias cinestream --ks-pass env:KEYSTORE_PASSWORD \
              --out CineStream-latest.apk "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.p12"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing; publishing debug-signed APK"
            cp "$(ls android/app/build/outputs/apk/debug/*.apk | head -1)" CineStream-latest.apk
          fi
          "$BT/apksigner" verify CineStream-latest.apk
          cp CineStream-latest.apk "CineStream-${SHORT}.apk"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: CineStream-apk
          path: CineStream-*.apk

      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest CineStream-latest.apk "CineStream-${SHORT}.apk" \
            --target "$GITHUB_SHA" \
            --title "CineStream (latest build)" \
            --notes "Automated build of commit ${GITHUB_SHA} on $(date -u +'%Y-%m-%d %H:%M UTC')."
